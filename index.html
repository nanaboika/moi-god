<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e9">
<meta name="description" content="МОЙ ГОД — персональная система планирования жизни на год.">
<title>МОЙ ГОД — планировщик жизни</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--paper:#f5f1e9;--card:#fffdf8;--ink:#292a28;--muted:#77766f;--gold:#b39455;--gold2:#d8c49a;--line:#e7e0d4;--sage:#68796a;--shadow:0 12px 35px rgba(48,42,30,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;min-height:100vh;padding:0 22px 50px}
.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px;border-bottom:1px solid var(--line);gap:12px}
.brand{font-family:Georgia,serif;font-size:25px;letter-spacing:.13em}
.brand small{display:block;font:10px sans-serif;letter-spacing:.22em;color:var(--muted);margin-top:3px}
.topright{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.yearpill{border:1px solid var(--gold2);padding:7px 12px;border-radius:30px;color:#806a3f;font-size:13px;white-space:nowrap}
.syncpill{font-size:11px;color:var(--sage);background:rgba(104,121,106,.1);padding:5px 10px;border-radius:20px;white-space:nowrap}
.layout{display:grid;grid-template-columns:235px 1fr;gap:28px;padding-top:25px}
.nav{position:sticky;top:15px;align-self:start;background:rgba(255,253,248,.65);border:1px solid var(--line);border-radius:18px;padding:13px}
.nav button{width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:10px;color:#55554f;font-size:13px;margin:2px 0;transition:.15s}
.nav button.active,.nav button:hover{background:#eee7d9;color:var(--ink)}
.nav .navgroup{font-size:10px;color:#a18b60;letter-spacing:.15em;padding:13px 12px 4px;text-transform:uppercase}
.content{min-width:0}
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 30px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #e8dfce;border-radius:50%;right:-65px;top:-105px;box-shadow:0 0 0 18px rgba(179,148,85,.035),0 0 0 38px rgba(179,148,85,.025);pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.hero h1{font:34px/1.16 Georgia,serif;font-weight:400;margin:10px 0}
.hero p{color:var(--muted);max-width:620px;margin:0}
.hero-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:1px solid var(--gold);background:var(--ink);color:#fffdf8;border-radius:30px;padding:10px 17px;font-size:13px;transition:.15s}
.btn:hover{opacity:.9}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.secondary:hover{background:#eee7d9}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fffdf8}
.btn.danger{background:transparent;color:#a84a3f;border-color:#e3c5c1}
.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:28px 0 14px}
.sectionhead h2{font:27px Georgia,serif;font-weight:400;margin:0}
.sectionhead p{color:var(--muted);font-size:13px;margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px}
.tile{min-height:132px;cursor:pointer;transition:.18s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .num{font:24px Georgia,serif;color:var(--gold)}
.tile h3{font:18px Georgia,serif;font-weight:400;margin:8px 0 3px}
.tile p,.muted{color:var(--muted);font-size:13px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}
.stat{background:#eee8dc;border-radius:14px;padding:14px}
.stat strong{font:25px Georgia,serif;display:block}
.stat span{font-size:11px;color:var(--muted)}
.progress{height:6px;background:#e8e1d5;border-radius:20px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--gold);border-radius:20px;transition:width .3s}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field label{font-size:12px;color:#77766f}
.field input,.field textarea,.field select{width:100%;background:#fffefa;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);outline:none}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item{padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.tag{display:inline-block;background:#eee8dc;color:#74613c;padding:4px 9px;border-radius:20px;font-size:11px}
.del{border:0;background:none;color:#a49c8d;font-size:19px;padding:4px 8px}
.del:hover{color:#a84a3f}
.wheelwrap{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr);gap:20px;align-items:center}
.wheel{width:100%;max-width:390px;margin:auto;display:block}
.rangeRow{display:grid;grid-template-columns:1fr 38px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
input[type=range]{accent-color:var(--gold);width:100%}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.month{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fffefa;min-height:105px;cursor:pointer;transition:.15s}
.month:hover,.month.selected{border-color:var(--gold);background:#fbf7ee}
.month strong{font:17px Georgia,serif;display:block;margin-bottom:6px}
.month small{color:var(--muted)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:7px 0;cursor:pointer}
.check input{accent-color:var(--sage);margin-top:3px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px;font-size:13px}
.footer{color:#a19a8d;font-size:11px;text-align:center;padding:30px 0 10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#292a28;color:#fff;padding:10px 18px;border-radius:30px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1}
.mobilebar{display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(41,42,40,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40;backdrop-filter:blur(3px)}
.modal-backdrop.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.modal h3{font:21px Georgia,serif;font-weight:400;margin:0 0 8px}
@media(max-width:760px){
  .app{padding:0 14px 86px}
  .top{padding:17px 0}
  .brand{font-size:21px}
  .layout{display:block;padding-top:15px}
  .nav{display:none}
  .hero{padding:23px 20px}
  .hero h1{font-size:29px}
  .grid{grid-template-columns:1fr 1fr;gap:9px}
  .tile{padding:13px;min-height:120px}
  .tile h3{font-size:16px}
  .stats{gap:7px}
  .stat{padding:10px}
  .stat strong{font-size:21px}
  .formgrid{grid-template-columns:1fr}
  .wheelwrap{grid-template-columns:1fr}
  .months{grid-template-columns:repeat(2,1fr)}
  .mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,248,.97);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;z-index:10;backdrop-filter:blur(10px)}
  .mobilebar button{background:none;border:0;color:#777;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 6px}
  .mobilebar b{font-size:17px;font-weight:400}
  .mobilebar button.active{color:#967b43}
  .sectionhead h2{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">МОЙ ГОД<small>ПРОЕКТИРУЙ. ДЕЙСТВУЙ. ЖИВИ.</small></div>
  <div class="topright">
    <span class="syncpill" id="syncStatus">Локально</span>
    <span class="yearpill" id="yearLabel">2027 · МОЙ ПЛАН</span>
    <button class="btn secondary" onclick="exportData()">Экспорт</button>
  </div>
</header>
<div class="layout">
<aside class="nav" id="sideNav">
  <div class="navgroup">Мой год</div>
  <button data-page="home" class="active">⌂　Обзор</button>
  <button data-page="review">01　Итоги года</button>
  <button data-page="wheel">02　Колесо баланса</button>
  <button data-page="future">03　Путешествие в будущее</button>
  <button data-page="goals">04　Желания и цели</button>
  <button data-page="months">05　План по месяцам</button>
  <div class="navgroup">Моя жизнь</div>
  <button data-page="hobbies">✳　Хочу попробовать</button>
  <button data-page="reflection">06　Итоги месяца</button>
  <button data-page="settings">⚙　Мои данные</button>
</aside>
<main class="content" id="main"></main>
</div>
<div class="footer">МОЙ ГОД · Личное пространство для планирования жизни</div>
</div>

<nav class="mobilebar">
  <button data-page="home" class="active"><b>⌂</b>Обзор</button>
  <button data-page="goals"><b>◎</b>Цели</button>
  <button data-page="months"><b>▦</b>Месяцы</button>
  <button data-page="hobbies"><b>✳</b>Хочу</button>
  <button data-page="wheel"><b>◉</b>Баланс</button>
  <button data-page="settings"><b>⚙</b>Данные</button>
</nav>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toast" id="toast">Сохранено</div>

<script>
const SUPABASE_URL = 'https://sktdzgzzthmhtslmltac.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5DhJevtuh0t17B1vvabFFQ_OlkGbD48';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const KEY = 'moi-god-v1';
const spheres = ['Здоровье и внешность','Семья и дети','Отношения с партнёром','Деньги','Работа и карьера','Бизнес и самореализация','Отдых и путешествия','Развитие и хобби'];
const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
let telegramUserId = null;

if (tg) {
  tg.ready();
  tg.expand();
  if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
    telegramUserId = String(tg.initDataUnsafe.user.id);
  }
}

let data = loadLocal();
let page = 'home';
let activeMonth = 0;
let saveTimer = null;

function blank() {
  return {
    year: new Date().getFullYear() + 1,
    review: {},
    ratings: Array(8).fill(5),
    wheelPriority: '',
    future: {},
    goals: [],
    hobbies: [],
    monthly: {},
    reflections: {}
  };
}

function loadLocal() {
  try {
    return { ...blank(), ...JSON.parse(localStorage.getItem(KEY) || '{}') };
  } catch (e) {
    return blank();
  }
}

function setSyncLabel(text) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = text;
}

async function initCloud() {
  if (!sb || !telegramUserId) {
    setSyncLabel('Локально в браузере');
    return;
  }
  setSyncLabel('Синхронизация...');
  try {
    const { data: row, error } = await sb
      .from('user_plans')
      .select('data')
      .eq('telegram_id', telegramUserId)
      .maybeSingle();

    if (!error && row && row.data) {
      data = { ...blank(), ...row.data };
      localStorage.setItem(KEY, JSON.stringify(data));
      render();
    } else if (!error && !row) {
      await pushToCloud();
    }
    setSyncLabel('Облако Telegram ✓');
  } catch (e) {
    setSyncLabel('Офлайн-режим');
  }
}

async function pushToCloud() {
  if (!sb || !telegramUserId) return;
  setSyncLabel('Сохранение...');
  try {
    const { error } = await sb
      .from('user_plans')
      .upsert({
        telegram_id: telegramUserId,
        data: data,
        updated_at: new Date().toISOString()
      });
    setSyncLabel(error ? 'Ошибка сети' : 'Облако Telegram ✓');
  } catch (e) {
    setSyncLabel('Ошибка сети');
  }
}

function save(msg = true) {
  localStorage.setItem(KEY, JSON.stringify(data));
  if (msg) toast('Сохранено');
  if (sb && telegramUserId) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushToCloud, 600);
  }
}

function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1600);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function openModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
}

function nav(p) {
  page = p;
  document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === p));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => nav(b.dataset.page)));

function head(title, sub, action = '') {
  return `<div class="sectionhead"><div><div class="eyebrow">МОЙ ${data.year} ГОД</div><h2>${title}</h2><p>${sub || ''}</p></div>${action}</div>`;
}

function render() {
  document.getElementById('yearLabel').textContent = data.year + ' · МОЙ ПЛАН';
  const m = document.getElementById('main');
  m.innerHTML = pages[page]();
  wire();
}

const pages = {
  home: () => {
    const complete = [
      Object.values(data.review).filter(Boolean).length > 0,
      data.ratings.some(x => x !== 5),
      Object.values(data.future).some(Boolean),
      data.goals.length > 0,
      Object.values(data.monthly).some(a => a && a.length),
      data.hobbies.length > 0
    ].filter(Boolean).length;

    const userName = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name
      ? `, ${esc(tg.initDataUnsafe.user.first_name)}`
      : '';

    return `
<section class="hero">
  <div class="eyebrow">ТВОЁ ЛИЧНОЕ ПРОСТРАНСТВО${userName.toUpperCase()}</div>
  <h1>Твой год начинается<br>с твоего решения.</h1>
  <p>Здесь ты собираешь всё, что хочешь изменить, попробовать и прожить. Не идеальный план, а твой собственный маршрут на ${data.year} год.</p>
  <div class="hero-actions">
    <button class="btn gold" onclick="nav('review')">Начать планирование →</button>
    <button class="btn secondary" onclick="nav('goals')">К моим целям</button>
  </div>
</section>
<div class="stats">
  <div class="stat"><strong>${data.goals.length}</strong><span>целей записано</span></div>
  <div class="stat"><strong>${data.hobbies.length}</strong><span>новых впечатлений</span></div>
  <div class="stat"><strong>${complete}/6</strong><span>этапов начато</span></div>
</div>
${head('Твой маршрут', 'Проходи этапы в своём темпе. Все записи сохраняются автоматически.')}
<div class="grid">${[
  ['review', '01', 'Итоги прошлого года', 'Остановиться, оглянуться и забрать важное.'],
  ['wheel', '02', 'Колесо баланса', 'Посмотреть, как сейчас распределено внимание.'],
  ['future', '03', 'Путешествие в будущее', 'Представить свою жизнь через год.'],
  ['goals', '04', 'Желания и цели', 'Записать, чего хочется в каждой сфере.'],
  ['months', '05', 'План по месяцам', 'Превратить желания в последовательность действий.'],
  ['hobbies', '✳', 'Хочу попробовать', 'Оставить место любопытству и новым увлечениям.']
].map(x => `<div class="tile" onclick="nav('${x[0]}')"><div class="num">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></div>`).join('')}</div>
${head('Небольшое напоминание', 'План — это компас, а не клетка. Его можно менять вместе с жизнью.')}`;
  },

  review: () => `${head('Итоги прошлого года', 'Сначала замечаем, что уже произошло. Не обесценивай маленькие победы.')}
<div class="panel">
  <div class="field"><label>Три главных события года</label><textarea data-review="events" oninput="autoSaveField('review',this)" placeholder="Что особенно запомнилось?">${esc(data.review.events)}</textarea></div>
  <div class="field"><label>Чем я горжусь?</label><textarea data-review="proud" oninput="autoSaveField('review',this)" placeholder="Даже если это было непросто...">${esc(data.review.proud)}</textarea></div>
  <div class="field"><label>Какие цели и желания удалось реализовать?</label><textarea data-review="achieved" oninput="autoSaveField('review',this)">${esc(data.review.achieved)}</textarea></div>
  <div class="field"><label>Что не получилось? Почему?</label><textarea data-review="notdone" oninput="autoSaveField('review',this)">${esc(data.review.notdone)}</textarea></div>
  <div class="field"><label>Какие уроки я забираю с собой?</label><textarea data-review="lessons" oninput="autoSaveField('review',this)">${esc(data.review.lessons)}</textarea></div>
  <div class="field"><label>Что я хочу оставить в прошлом году?</label><textarea data-review="leave" oninput="autoSaveField('review',this)">${esc(data.review.leave)}</textarea></div>
  <button class="btn gold" onclick="saveFields('review')">Сохранить итоги</button>
</div>`,

  wheel: () => `${head('Колесо баланса', 'Оцени каждую сферу от 1 до 10. Это не экзамен, а снимок твоего состояния сегодня.')}
<div class="panel wheelwrap">
  <div>
    <svg id="wheelSvg" class="wheel" viewBox="0 0 360 360"></svg>
    <p class="muted" style="text-align:center;margin-top:8px">Диаграмма обновляется при изменении оценок</p>
  </div>
  <div>
    ${spheres.map((s, i) => `<div class="rangeRow"><div><label>${i + 1}. ${s}</label><input type="range" min="1" max="10" value="${data.ratings[i]}" oninput="setRating(${i},this.value)"></div><strong id="rate${i}">${data.ratings[i]}</strong></div>`).join('')}
    <div class="field"><label>Какие две сферы сейчас важнее всего изменить?</label><textarea data-wheel="priority" oninput="autoSaveField('wheel',this)" placeholder="Запиши свои наблюдения...">${esc(data.wheelPriority)}</textarea></div>
    <button class="btn gold" onclick="saveFields('wheel')">Сохранить колесо</button>
  </div>
</div>`,

  future: () => `${head('Путешествие в будущее', `Представь, что сегодня 31 декабря ${data.year} года. Ты оглядываешься на прожитый год. Каким он стал?`)}
<div class="hero" style="margin-bottom:14px">
  <div class="eyebrow">НЕ СПЕШИ. ПРЕДСТАВЬ.</div>
  <h1 style="font-size:27px">Ты уже там. Это твой декабрь.</h1>
  <p>Можно включить спокойную музыку, закрыть глаза и представить обычный день своей будущей жизни. Затем возвращайся и записывай то, что увидела.</p>
</div>
<div class="panel">
  ${[
    ['place', 'Где ты живёшь и как выглядит твоё пространство?'],
    ['day', 'Как проходит твой обычный день?'],
    ['work', 'Чем ты занимаешься и как зарабатываешь?'],
    ['people', 'Кто рядом с тобой? Какие у тебя отношения с близкими?'],
    ['body', 'Как ты себя чувствуешь? Как заботишься о себе?'],
    ['joy', 'Что нового и радостного появилось в твоей жизни?'],
    ['proud', 'За что ты благодарна себе в этом году?'],
    ['word', 'Одним словом: каким был твой год?']
  ].map(([k, l]) => `<div class="field"><label>${l}</label><textarea data-future="${k}" oninput="autoSaveField('future',this)" placeholder="Опиши свою картину...">${esc(data.future[k])}</textarea></div>`).join('')}
  <button class="btn gold" onclick="saveFields('future')">Сохранить моё будущее</button>
</div>`,

  goals: () => `${head('Мои желания и цели', 'Записывай важное по сферам. Не каждое желание обязано стать задачей прямо сейчас.')}
<div class="panel">
  <div class="formgrid">
    <div class="field"><label>Жизненная сфера</label><select id="goalSphere">${spheres.map((s, i) => `<option value="${i}">${s}</option>`).join('')}</select></div>
    <div class="field"><label>Тип</label><select id="goalType"><option>Цель</option><option>Мечта</option><option>Изменение</option></select></div>
  </div>
  <div class="field"><label>Чего я хочу?</label><input id="goalTitle" placeholder="Например: пробежать полумарафон"></div>
  <div class="field"><label>Почему это важно для меня?</label><textarea id="goalWhy" placeholder="Что изменится, когда это произойдёт?"></textarea></div>
  <div class="formgrid">
    <div class="field"><label>Как пойму, что получилось?</label><input id="goalResult" placeholder="Измеримый результат"></div>
    <div class="field"><label>Желаемый месяц результата</label><select id="goalMonth"><option value="">Пока не знаю</option>${months.map((m, i) => `<option value="${i}">${m}</option>`).join('')}</select></div>
  </div>
  <button class="btn gold" onclick="addGoal()">Добавить в мой список</button>
</div>
${head('Мой список', 'Нажми «План действий», чтобы добавить конкретный шаг в выбранный месяц.')}
${data.goals.length ? data.goals.map((g, i) => `<div class="panel item" style="margin-bottom:12px">
  <div class="between">
    <div><span class="tag">${spheres[g.sphere]}</span> <span class="tag">${g.type}</span>${g.month !== '' && g.month !== undefined ? ` <span class="tag">Ориентир: ${months[+g.month]}</span>` : ''}</div>
    <button class="del" onclick="confirmDeleteGoal(${i})">×</button>
  </div>
  <h3 style="font:20px Georgia,serif;margin:9px 0">${esc(g.title)}</h3>
  ${g.why ? `<p class="muted">${esc(g.why)}</p>` : ''}
  ${g.result ? `<p class="muted" style="margin-top:4px">Критерий: ${esc(g.result)}</p>` : ''}
  <div class="row" style="margin-top:12px">
    <button class="btn secondary" onclick="openGoalActionModal(${i})">+ Шаг в план месяца</button>
    <span class="muted">${(g.tasks || []).length} шагов</span>
  </div>
</div>`).join('') : '<div class="empty">Здесь появятся твои цели и мечты.</div>'}`,

  months: () => `${head('План на 12 месяцев', 'Выбирай месяц, добавляй действия и связывай их со своими целями.')}
<div class="months">${months.map((m, i) => {
  const arr = data.monthly[i] || [];
  return `<div class="month ${activeMonth === i ? 'selected' : ''}" id="monthCard${i}" onclick="openMonth(${i})"><strong>${m}</strong><small>${arr.filter(x => x.done).length}/${arr.length} выполнено</small><div class="progress"><i style="width:${arr.length ? 100 * arr.filter(x => x.done).length / arr.length : 0}%"></i></div></div>`;
}).join('')}</div>
<div id="monthDetail" style="margin-top:16px"></div>`,

  hobbies: () => `${head('Хочу попробовать!', 'Не всё в жизни должно быть целью. Оставь место экспериментам, интересу и удовольствию.')}
<div class="panel">
  <div class="field"><label>Что хочется попробовать?</label><input id="hobbyTitle" placeholder="Например: урок верховой езды"></div>
  <div class="formgrid">
    <div class="field"><label>Почему мне это интересно?</label><input id="hobbyWhy" placeholder="Давно мечтала..."></div>
    <div class="field"><label>Когда хотелось бы попробовать?</label><select id="hobbyMonth"><option value="">Пока не знаю</option>${months.map((m, i) => `<option value="${i}">${m}</option>`).join('')}</select></div>
  </div>
  <div class="field"><label>Первый маленький шаг</label><input id="hobbyStep" placeholder="Найти студию, узнать расписание..."></div>
  <button class="btn gold" onclick="addHobby()">Добавить в список</button>
</div>
${head('Моя коллекция впечатлений', 'Отмечай, что уже попробовала — даже если решила, что это не твоё.')}
${data.hobbies.length ? data.hobbies.map((h, i) => `<div class="panel item" style="margin-bottom:12px">
  <div class="between">
    <div><span class="tag">${h.month === '' ? 'Без даты' : months[+h.month]}</span> <span class="tag">${h.done ? 'Попробовала ✓' : 'Хочу попробовать'}</span></div>
    <button class="del" onclick="deleteHobby(${i})">×</button>
  </div>
  <div class="between">
    <h3 style="font:19px Georgia,serif;margin:8px 0">${esc(h.title)}</h3>
    <button class="btn secondary" onclick="toggleHobby(${i})">${h.done ? 'Вернуть в список' : 'Я попробовала!'}</button>
  </div>
  <p class="muted">${esc(h.why)}${h.step ? ' · Первый шаг: ' + esc(h.step) : ''}</p>
</div>`).join('') : '<div class="empty">Твоя коллекция новых впечатлений пока пуста. Это легко исправить.</div>'}`,

  reflection: () => `${head('Итоги месяца', 'Небольшая остановка, чтобы заметить прогресс и скорректировать маршрут.')}
<div class="panel">
  <div class="field"><label>Месяц</label><select id="reflectionMonth" onchange="loadReflectionForm(this.value)">${months.map((m, i) => `<option value="${i}">${m}</option>`).join('')}</select></div>
  ${[
    ['wins', 'Что получилось в этом месяце?'],
    ['hard', 'Что оказалось сложным?'],
    ['learned', 'Что я поняла или чему научилась?'],
    ['next', 'Что переношу или меняю в следующем месяце?'],
    ['thanks', 'За что благодарна себе?']
  ].map(([k, l]) => `<div class="field"><label>${l}</label><textarea id="refl_${k}" placeholder="Запиши свои мысли..."></textarea></div>`).join('')}
  <button class="btn gold" onclick="saveReflection()">Сохранить итоги месяца</button>
</div>
${head('Мои прошлые заметки', 'Возвращайся к ним, чтобы видеть свой путь.')}
${Object.keys(data.reflections).length ? Object.keys(data.reflections).sort((a, b) => a - b).map(k => `<div class="panel item" style="margin-bottom:10px;cursor:pointer" onclick="selectReflection(${k})"><strong>${months[+k]}</strong><p class="muted">${esc(data.reflections[k].wins || data.reflections[k].thanks || 'Заметка сохранена')}</p></div>`).join('') : '<div class="empty">Здесь появятся твои ежемесячные итоги.</div>'}`,

  settings: () => `${head('Мои данные', 'Настрой год планирования и управляй резервной копией записей.')}
<div class="panel">
  <div class="field"><label>Год планирования</label><input type="number" id="planYear" min="2024" max="2100" value="${data.year}"></div>
  <button class="btn gold" onclick="changeYear()">Сохранить год</button>
  <hr style="border:0;border-top:1px solid var(--line);margin:22px 0">
  <h3 style="font:20px Georgia,serif;margin:0 0 6px">Статус облака</h3>
  <p class="muted">${telegramUserId ? 'Аккаунт Telegram подключён (ID: ' + esc(telegramUserId) + '). Все записи автоматически сохраняются в облачную базу.' : 'Приложение открыто в обычном браузере — данные сохраняются на этом устройстве.'}</p>
  <hr style="border:0;border-top:1px solid var(--line);margin:22px 0">
  <h3 style="font:20px Georgia,serif;margin:0 0 6px">Резервная копия (JSON)</h3>
  <p class="muted">Скачай файл со своими данными, чтобы хранить его отдельно или перенести записи.</p>
  <div class="row" style="margin-top:12px">
    <button class="btn secondary" onclick="exportData()">Скачать мои данные</button>
    <label class="btn secondary" style="cursor:pointer">Импортировать<input type="file" accept="application/json" hidden onchange="importData(event)"></label>
  </div>
</div>`
};

function wire() {
  if (page === 'wheel') drawWheel();
  if (page === 'months') openMonth(activeMonth);
  if (page === 'reflection') loadReflectionForm(0);
}

function autoSaveField(group, el) {
  const k = el.dataset[group];
  if (group === 'review') data.review[k] = el.value;
  else if (group === 'future') data.future[k] = el.value;
  else if (group === 'wheel') data.wheelPriority = el.value;
  save(false);
}

function saveFields(group) {
  document.querySelectorAll(`[data-${group}]`).forEach(el => {
    const k = el.dataset[group];
    if (group === 'review') data.review[k] = el.value;
    else if (group === 'future') data.future[k] = el.value;
    else if (group === 'wheel') data.wheelPriority = el.value;
  });
  save(true);
}

function setRating(i, v) {
  data.ratings[i] = +v;
  document.getElementById('rate' + i).textContent = v;
  drawWheel();
  save(false);
}

function drawWheel() {
  const svg = document.getElementById('wheelSvg');
  if (!svg) return;
  const cx = 180, cy = 180, r = 135, n = 8, pts = [];
  for (let j = 0; j < n; j++) {
    const a = -Math.PI / 2 + j * 2 * Math.PI / n;
    const rr = r * data.ratings[j] / 10;
    pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)].join(','));
  }
  let s = '';
  for (let ring = 2; ring <= 10; ring += 2) {
    const p = [];
    for (let j = 0; j < n; j++) {
      const a = -Math.PI / 2 + j * 2 * Math.PI / n;
      p.push([cx + r * ring / 10 * Math.cos(a), cy + r * ring / 10 * Math.sin(a)].join(','));
    }
    s += `<polygon points="${p.join(' ')}" fill="none" stroke="#e5ddcf" stroke-width="1"/>`;
  }
  for (let j = 0; j < n; j++) {
    const a = -Math.PI / 2 + j * 2 * Math.PI / n;
    s += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(a)}" y2="${cy + r * Math.sin(a)}" stroke="#e5ddcf"/>`;
  }
  s += `<polygon points="${pts.join(' ')}" fill="rgba(179,148,85,.25)" stroke="#b39455" stroke-width="2"/>`;
  pts.forEach(p => {
    const [x, y] = p.split(',');
    s += `<circle cx="${x}" cy="${y}" r="4.5" fill="#9b7e43"/>`;
  });
  s += `<circle cx="${cx}" cy="${cy}" r="3" fill="#9b7e43"/>`;
  spheres.forEach((v, j) => {
    const a = -Math.PI / 2 + j * 2 * Math.PI / n;
    const x = cx + 158 * Math.cos(a);
    const y = cy + 158 * Math.sin(a);
    s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#777">${j + 1}</text>`;
  });
  svg.innerHTML = s;
}

function addGoal() {
  const title = document.getElementById('goalTitle').value.trim();
  if (!title) { toast('Напиши, чего ты хочешь'); return; }
  data.goals.push({
    title,
    sphere: +document.getElementById('goalSphere').value,
    type: document.getElementById('goalType').value,
    why: document.getElementById('goalWhy').value,
    result: document.getElementById('goalResult').value,
    month: document.getElementById('goalMonth').value,
    tasks: []
  });
  save();
  render();
}

function confirmDeleteGoal(i) {
  openModal(`
    <h3>Удалить цель?</h3>
    <p class="muted" style="margin-bottom:18px">Цель «${esc(data.goals[i].title)}» будет удалена из списка.</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn secondary" onclick="closeModal()">Отмена</button>
      <button class="btn danger" onclick="deleteGoal(${i})">Удалить</button>
    </div>
  `);
}

function deleteGoal(i) {
  data.goals.splice(i, 1);
  closeModal();
  save();
  render();
}

function openGoalActionModal(i) {
  const g = data.goals[i];
  openModal(`
    <div class="eyebrow">ПЛАН ДЕЙСТВИЙ</div>
    <h3 style="margin-top:4px">${esc(g.title)}</h3>
    <div class="field"><label>В каком месяце сделать шаг?</label><select id="modalActionMonth">${months.map((m, idx) => `<option value="${idx}" ${String(g.month) === String(idx) ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
    <div class="field"><label>Какое конкретное действие?</label><input id="modalActionText" placeholder="Например: записаться на пробное занятие"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn secondary" onclick="closeModal()">Отмена</button>
      <button class="btn gold" onclick="saveGoalAction(${i})">Добавить в план</button>
    </div>
  `);
}

function saveGoalAction(i) {
  const text = document.getElementById('modalActionText').value.trim();
  if (!text) { toast('Напиши действие'); return; }
  const mi = +document.getElementById('modalActionMonth').value;
  const g = data.goals[i];
  g.tasks ??= [];
  g.tasks.push({ month: mi, text, done: false });
  data.monthly[mi] ??= [];
  data.monthly[mi].push({ text, goal: g.title, done: false });
  closeModal();
  save();
  render();
}

function addHobby() {
  const title = document.getElementById('hobbyTitle').value.trim();
  if (!title) { toast('Добавь увлечение'); return; }
  data.hobbies.push({
    title,
    why: document.getElementById('hobbyWhy').value,
    month: document.getElementById('hobbyMonth').value,
    step: document.getElementById('hobbyStep').value,
    done: false
  });
  save();
  render();
}

function deleteHobby(i) {
  data.hobbies.splice(i, 1);
  save();
  render();
}

function toggleHobby(i) {
  data.hobbies[i].done = !data.hobbies[i].done;
  save();
  render();
}

function openMonth(i) {
  activeMonth = i;
  document.querySelectorAll('.month').forEach((el, idx) => el.classList.toggle('selected', idx === i));
  const d = document.getElementById('monthDetail');
  if (!d) return;
  const arr = data.monthly[i] || [];
  d.innerHTML = `<div class="panel">
    <div class="between">
      <div><div class="eyebrow">МОИ ДЕЙСТВИЯ</div><h3 style="font:22px Georgia,serif;margin:4px 0">${months[i]}</h3></div>
      <span class="tag">${arr.filter(x => x.done).length}/${arr.length}</span>
    </div>
    <div class="field"><label>Новое действие</label><input id="taskText" placeholder="Что я сделаю в этом месяце?"></div>
    <div class="field"><label>Связать с целью (необязательно)</label><select id="taskGoal"><option value="">Без привязки</option>${data.goals.map(g => `<option>${esc(g.title)}</option>`).join('')}</select></div>
    <button class="btn gold" onclick="addTask(${i})">Добавить действие</button>
    <div style="margin-top:12px">${arr.length ? arr.map((t, j) => `<div class="between item"><label class="check"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${i},${j},this.checked)"><span style="${t.done ? 'text-decoration:line-through;color:#999' : ''}">${esc(t.text)} ${t.goal ? '<span class="tag">' + esc(t.goal) + '</span>' : ''}</span></label><button class="del" onclick="deleteTask(${i},${j})">×</button></div>`).join('') : '<div class="empty">Пока нет действий. Добавь первый маленький шаг.</div>'}</div>
  </div>`;
}

function addTask(i) {
  const text = document.getElementById('taskText').value.trim();
  if (!text) return;
  data.monthly[i] ??= [];
  data.monthly[i].push({ text, goal: document.getElementById('taskGoal').value, done: false });
  save();
  openMonth(i);
  renderMonthProgress();
}

function toggleTask(i, j, v) {
  data.monthly[i][j].done = v;
  save(false);
  openMonth(i);
  renderMonthProgress();
}

function deleteTask(i, j) {
  data.monthly[i].splice(j, 1);
  save();
  openMonth(i);
  renderMonthProgress();
}

function renderMonthProgress() {
  const p = document.querySelectorAll('.month');
  if (!p.length) return;
  p.forEach((el, i) => {
    const a = data.monthly[i] || [];
    el.querySelector('small').textContent = `${a.filter(x => x.done).length}/${a.length} выполнено`;
    el.querySelector('i').style.width = (a.length ? 100 * a.filter(x => x.done).length / a.length : 0) + '%';
  });
}

function loadReflectionForm(mIdx) {
  const r = data.reflections[mIdx] || {};
  ['wins', 'hard', 'learned', 'next', 'thanks'].forEach(k => {
    const el = document.getElementById('refl_' + k);
    if (el) el.value = r[k] || '';
  });
}

function selectReflection(mIdx) {
  const sel = document.getElementById('reflectionMonth');
  if (sel) {
    sel.value = mIdx;
    loadReflectionForm(mIdx);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function saveReflection() {
  const i = document.getElementById('reflectionMonth').value;
  data.reflections[i] = {};
  ['wins', 'hard', 'learned', 'next', 'thanks'].forEach(k => data.reflections[i][k] = document.getElementById('refl_' + k).value);
  save();
  render();
}

function changeYear() {
  const y = +document.getElementById('planYear').value;
  if (y < 2024 || y > 2100) return;
  data.year = y;
  save();
  render();
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'moi-god-' + data.year + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Файл подготовлен');
}

function importData(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      data = { ...blank(), ...JSON.parse(r.result) };
      save();
      render();
      toast('Данные импортированы');
    } catch (err) {
      toast('Не удалось прочитать файл');
    }
  };
  r.readAsText(f);
}

render();
initCloud();
</script>
</body>
</html>
